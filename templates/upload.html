{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <h2 class="text-2xl font-extrabold text-gray-900 mb-1">📥 Import New Price List</h2>
    <p class="text-sm text-gray-500 mb-6">Attach your 2-column spreadsheet file alongside an optional cover file photo for the car model profile.</p>
    
    <form method="POST" enctype="multipart/form-data" class="space-y-5">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Car Model Name</label>
            <input type="text" name="car_model" required placeholder="e.g. Tesla Model S" class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Quotation Date</label>
            <input type="date" name="quotation_date" required class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Car Profile Image (Optional)</label>
            <input type="file" name="car_photo" accept="image/*" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 text-sm file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>
        
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Attach Data Sheet (.xlsx or .csv)</label>
            <input type="file" name="excel_file" accept=".xlsx, .xls, .csv" required class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 text-sm file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>
        
        <div class="pt-4 flex justify-between items-center border-t border-gray-100">
            <a href="{{ url_for('models_gallery') }}" class="text-sm font-semibold text-gray-400 hover:text-gray-600 transition">Cancel</a>
            <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition shadow-sm">Save & Process Sheet</button>
        </div>
    </form>
</div>
{% endblock %}
